# Render Blueprint for the backend API. The frontend goes to Vercel (see docs/LIVE_DEPLOYMENT_STEPS.md).
services:
  - type: web
    name: captcha-inspector-api
    runtime: docker
    plan: starter            # Chromium needs memory; starter (512 MB) is enough for OCR + verification demos
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUDIT_HMAC_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/captcha_tool.db
      - key: ENABLE_LIVE_SCAN
        value: "false"
      - key: ALLOWED_DOMAINS
        value: ""
      # Set these in the Render dashboard (not committed):
      - key: CORS_ALLOWED_ORIGINS   # the exact Vercel URL, e.g. https://your-app.vercel.app
        sync: false
      - key: REVIEW_USER
        sync: false
      - key: REVIEW_PASSWORD
        sync: false
