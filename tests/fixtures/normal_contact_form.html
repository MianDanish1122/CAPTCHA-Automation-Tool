<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Acme Corporation</title>
</head>
<body>
    <header>
        <h1>Acme Corporation</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>
    <main>
        <h2>Get in Touch</h2>
        <p>Please send us a message and our team will get back to you shortly.</p>
        <form id="contact-form" action="/submit-contact" method="POST">
            <div>
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div>
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div>
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required placeholder="Inquiry">
            </div>
            <div>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" id="submit-btn">Send Message</button>
        </form>
    </main>
</body>
</html>
